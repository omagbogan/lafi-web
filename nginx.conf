server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Direct APK download with correct Android MIME type
    location /lafi.apk {
        alias /usr/share/nginx/html/lafi.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="lafi.apk"';
        add_header Cache-Control 'no-cache, must-revalidate';
    }

    # API Reverse Proxy (Transparent routing to FastAPI container)
    location ~ ^/(articles|ai|orders|auth|shops|customers|admin|health|uploads|docs|openapi.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing for React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

